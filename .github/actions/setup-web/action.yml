name: Set up the web workspace
description: Node, pnpm (cached store) and the frozen-lockfile install for web/.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.25.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Install web dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
