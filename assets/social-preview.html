<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swarm social preview</title>
<!-- Source for social-preview.png (1280x640). Build with assets/build-social-preview.sh. -->
<link rel="stylesheet" href="../design/tokens.css">
<style>
  @font-face {
    font-family: "Onest";
    src: url("../design/fonts/onest-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Fragment Mono";
    src: url("../design/fonts/fragment-mono-latin-400.woff2") format("woff2");
    font-weight: 400;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative; display: flex; align-items: center; gap: 72px; padding: 0 96px;
    font-family: var(--font-sans); color: var(--white); -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 600px at 18% 30%, rgb(123 92 240 / 0.45), transparent 70%),
      var(--gradient-night);
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgb(216 208 247 / 0.14) 1.2px, transparent 1.8px); background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(60% 80% at 75% 50%, #000, transparent 80%);
  }
  img { position: relative; width: 340px; height: 340px; flex: none; filter: var(--shadow-icon); }
  div { position: relative; }
  h1 { font-size: 120px; line-height: 1; font-weight: var(--weight-display); letter-spacing: -0.035em; }
  p { margin-top: 28px; max-width: 700px; font-size: 38px; line-height: 1.28; font-weight: 400; letter-spacing: -0.01em; color: var(--violet-100); }
  .url { position: absolute; left: 0; bottom: -86px; font: 24px/1 var(--font-mono); color: var(--violet-300); }
</style>
</head>
<body>
<img src="../apps/menubar/Resources/AppIconLayers/Composed-1024.png" alt="">
<div>
  <h1>Swarm</h1>
  <p>Run your coding agents as a team.</p>
  <span class="url">swarmrun.dev</span>
</div>
</body>
</html>
